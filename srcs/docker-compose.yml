version: '3'

services:
  mariadb:
    container_name: mariadb
    networks:
    - inception
    context: requirements/mariadb
    dockerfile: Dockerfile
    env_file: .env
    volumes:
    - mariadb:/var/lib/mysql
    restart: unless-stopped
    expose:
    - "3306"

  nginx:
    container_name: nginx
    networks:
      - inception
    depends_on: # Wait for the wordpress container to be ready
      - wordpress
    context: requirements/nginx
    dockerfile: Dockerfile
    env_file: .env
    ports:
      - "443:443"
    restart: on-failure

  wordpress:
    container_name: wordpress
    networks:
      - inception
    build:
    context: requirements/wordpress
    dockerfile: Dockerfile
    env_file: .env
    volumes:
      - wordpress:/var/www/wordpress
    depends_on:
      - mariadb
    restart: on-failure
    expose:
      - "9000"

  volumes:
    mariadb_data:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/Users/myevou/data/wordpress' # Change this if external volume is used
    wordpress_data:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/Users/myevou/data/mariadb' # Change this if external volume is used

  networks:
    inception:
    driver: bridge
